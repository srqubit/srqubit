<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="100%" role="img" aria-label="Gustavo Josias de Lacerda — Diretor de Desenvolvimento e Tecnologia. Software, automação industrial, dados e IA.">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b0f17"/>
      <stop offset="1" stop-color="#111a2b"/>
    </linearGradient>
    <linearGradient id="name" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#9be9d0"/>
    </linearGradient>
    <linearGradient id="area" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2ee6a8" stop-opacity=".28"/>
      <stop offset="1" stop-color="#2ee6a8" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity=".045" stroke-width="1"/>
    </pattern>
    <radialGradient id="glow" cx=".85" cy=".1" r=".7">
      <stop offset="0" stop-color="#2ee6a8" stop-opacity=".16"/>
      <stop offset="1" stop-color="#2ee6a8" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="5"/>
    </filter>
    <clipPath id="frame"><rect width="1200" height="400" rx="18"/></clipPath>
  </defs>

  <style>
    .sans{font-family:'Segoe UI',-apple-system,BlinkMacSystemFont,Helvetica,Arial,sans-serif}
    .mono{font-family:ui-monospace,SFMono-Regular,'Cascadia Code',Consolas,'Liberation Mono',monospace}
    .in{opacity:0;animation:in .9s ease-out forwards}
    .d1{animation-delay:.15s}.d2{animation-delay:.4s}.d3{animation-delay:.65s}.d4{animation-delay:.9s}.d5{animation-delay:1.2s}
    @keyframes in{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
    .flow{stroke-dasharray:10 14;animation:flow 1s linear infinite}
    @keyframes flow{to{stroke-dashoffset:-24}}
    .draw{stroke-dasharray:1;stroke-dashoffset:1;animation:draw 8s ease-in-out infinite}
    @keyframes draw{0%{stroke-dashoffset:1;opacity:1}50%,92%{stroke-dashoffset:0;opacity:1}100%{stroke-dashoffset:0;opacity:0}}
    .fill{opacity:0;animation:fill 8s ease-in-out infinite}
    @keyframes fill{0%,35%{opacity:0}55%,92%{opacity:1}100%{opacity:0}}
    .pulse{animation:pulse 1.8s ease-in-out infinite}
    @keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}
    .blink{animation:blink 1.1s steps(1) infinite}
    @keyframes blink{50%{opacity:0}}
    @media (prefers-reduced-motion:reduce){
      .in,.flow,.draw,.fill,.pulse,.blink{animation:none;opacity:1;stroke-dashoffset:0}
    }
  </style>

  <g clip-path="url(#frame)">
    <rect width="1200" height="400" fill="url(#bg)"/>
    <rect width="1200" height="400" fill="url(#grid)"/>
    <rect width="1200" height="400" fill="url(#glow)"/>
  </g>
  <rect x=".5" y=".5" width="1199" height="399" rx="18" fill="none" stroke="#2ee6a8" stroke-opacity=".25"/>

  <!-- Identidade -->
  <text x="70" y="78" class="mono in d1" font-size="14" fill="#2ee6a8" letter-spacing="1">// MSI ENGENHARIA &amp; TECNOLOGIA</text>
  <text x="68" y="138" class="sans in d2" font-size="47" font-weight="700" fill="url(#name)" letter-spacing="-.5">Gustavo Josias de Lacerda</text>
  <text x="70" y="178" class="sans in d3" font-size="21" fill="#c9d1d9">Diretor de Desenvolvimento &amp; Tecnologia</text>
  <text x="70" y="216" class="mono in d4" font-size="14.5" fill="#8b949e">20+ anos · software · automação industrial · dados &amp; IA<tspan class="blink" fill="#2ee6a8"> ▌</tspan></text>

  <!-- Painel de tendência (estilo SCADA) -->
  <g class="in d3">
    <rect x="770" y="48" width="360" height="176" rx="10" fill="#0b0f17" fill-opacity=".7" stroke="#ffffff" stroke-opacity=".12"/>
    <text x="788" y="72" class="mono" font-size="11" fill="#8b949e" letter-spacing="1">TREND · PV / SP</text>
    <circle cx="1104" cy="68" r="4" fill="#2ee6a8" class="pulse"/>
    <text x="1094" y="72" class="mono" font-size="11" fill="#2ee6a8" text-anchor="end">RUN</text>
    <g stroke="#ffffff" stroke-opacity=".07">
      <path d="M788 110H1112M788 145H1112M788 180H1112"/>
    </g>
    <path d="M788 118H1112" stroke="#f5b83d" stroke-width="1.5" stroke-dasharray="5 5" stroke-opacity=".85"/>
    <text x="1112" y="110" class="mono" font-size="10" fill="#f5b83d" text-anchor="end">SP</text>
    <path class="fill" d="M788 190 C820 190 832 124 862 126 S904 166 934 142 S984 100 1014 116 S1066 130 1112 108 V208 H788Z" fill="url(#area)"/>
    <path class="draw" pathLength="1" d="M788 190 C820 190 832 124 862 126 S904 166 934 142 S984 100 1014 116 S1066 130 1112 108" fill="none" stroke="#2ee6a8" stroke-width="2.5" stroke-linecap="round"/>
  </g>

  <!-- Ladder: do chão de fábrica ao código -->
  <g class="in d5">
    <text x="70" y="268" class="mono" font-size="11" fill="#8b949e" letter-spacing="1">NETWORK 1 · DO CHÃO DE FÁBRICA AO CÓDIGO</text>

    <!-- trilhos -->
    <path d="M70 282V362M1130 282V362" stroke="#c9d1d9" stroke-width="3" stroke-linecap="round"/>

    <!-- degrau base -->
    <g stroke="#3b4658" stroke-width="2.5" fill="none" stroke-linecap="round">
      <path d="M70 322H230M260 322H500M530 322H770M800 322H1018M1062 322H1130"/>
    </g>

    <!-- energização -->
    <g fill="#2ee6a8" fill-opacity=".18">
      <rect x="230" y="304" width="30" height="36"/>
      <rect x="500" y="304" width="30" height="36"/>
      <rect x="770" y="304" width="30" height="36"/>
    </g>
    <g class="flow" stroke="#2ee6a8" stroke-width="2.5" fill="none" stroke-linecap="round">
      <path d="M70 322H230M260 322H500M530 322H770M800 322H1018M1062 322H1130"/>
    </g>

    <!-- contatos -->
    <g stroke="#e6edf3" stroke-width="3" stroke-linecap="round">
      <path d="M230 304V340M260 304V340M500 304V340M530 304V340M770 304V340M800 304V340"/>
    </g>

    <!-- bobina -->
    <circle cx="1040" cy="322" r="26" fill="#f5b83d" filter="url(#soft)" class="pulse" opacity=".5"/>
    <path d="M1030 302a26 26 0 0 0 0 40M1050 302a26 26 0 0 1 0 40" fill="none" stroke="#f5b83d" stroke-width="3" stroke-linecap="round"/>
    <circle cx="1040" cy="322" r="5" fill="#f5b83d" class="pulse"/>

    <!-- rótulos -->
    <g class="mono" font-size="12" text-anchor="middle" fill="#e6edf3" letter-spacing=".5">
      <text x="245" y="296">SOFTWARE</text>
      <text x="515" y="296">AUTOMACAO</text>
      <text x="785" y="296">DADOS_IA</text>
      <text x="1040" y="288" fill="#f5b83d">INOVACAO</text>
    </g>
    <g class="mono" font-size="10.5" text-anchor="middle" fill="#8b949e">
      <text x="245" y="358">I0.0</text>
      <text x="515" y="358">I0.1</text>
      <text x="785" y="358">I0.2</text>
      <text x="1040" y="368">Q0.0</text>
    </g>
  </g>
</svg>
